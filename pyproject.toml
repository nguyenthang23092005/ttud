[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-vietnam-routing"
version = "0.1.0"
description = "Dynamic route-planning research platform for Vietnamese OSM road networks"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "networkx>=3.4,<3.7",
  "osmnx>=2.1,<2.2",
]

[project.optional-dependencies]
research = [
  "folium>=0.19,<0.21",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "scikit-learn>=1.6,<2",
  "streamlit>=1.41,<2",
  "streamlit-folium>=0.24,<0.27",
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
xgboost = ["xgboost>=2.1,<4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
